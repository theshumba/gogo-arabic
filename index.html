<!DOCTYPE html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1A1A2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.svg" />
    <title>Gogo Arabic - يلا عربي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* Pixel AE Arabic font — supports Arabic + English + diacritics at 8px */
      @font-face {
        font-family: 'PixelAE';
        src: url('/assets/fonts/PixelAE-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'PixelAE';
        src: url('/assets/fonts/PixelAE-Bold.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1A1A2E;
        color: #FFFFFF;
        font-family: 'Press Start 2P', cursive;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: unset;
        /* Mobile optimizations */
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      #root {
        width: 100vw;
        height: 100vh;
        position: relative;
        /* Prevent mobile bounce scroll */
        overscroll-behavior: none;
      }
      /* Arabic font classes */
      .arabic-title { font-family: 'Amiri', serif; direction: rtl; }
      .arabic-display { font-family: 'Noto Kufi Arabic', sans-serif; direction: rtl; }
      .arabic-body { font-family: 'Noto Naskh Arabic', serif; direction: rtl; }
      .pixel-font { font-family: 'Press Start 2P', cursive; }
      /* Phaser canvas fills container */
      canvas {
        image-rendering: pixelated !important;
        display: block;
        /* Prevent canvas touch issues on mobile */
        touch-action: none;
      }
      /* Smooth scrolling for mobile */
      @media (max-width: 768px) {
        * {
          -webkit-overflow-scrolling: touch;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dev helper: visit localhost:3000?reset to clear all save data and start fresh
      if (new URLSearchParams(window.location.search).has('reset')) {
        localStorage.clear();
        indexedDB.databases().then(dbs => dbs.forEach(db => indexedDB.deleteDatabase(db.name)));
        window.location.href = window.location.origin;
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
