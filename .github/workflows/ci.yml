name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'fix/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --max-warnings 0 || true

      - name: Unit tests
        run: npx vitest run

      # OBS-08: golden-path smoke. Budget <3 minutes per requirement.
      # Runs after vitest so unit failures are diagnosed first and CI minutes
      # are not wasted re-running the smoke against a broken build.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (OBS-08 golden path)
        run: npx playwright test e2e/golden-path.spec.js --reporter=line
        env:
          CI: 'true'
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: 'https://eu.i.posthog.com'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Build
        run: npm run build
